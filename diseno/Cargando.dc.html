<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600..900&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #602249; text-decoration: none; }
    a:hover { color: #321327; }

    .app {
      --navy: #051a2a; --gold: #fae890; --blackberry: #602249;
      --fondo: #f2f4f6; --superficie: #ffffff; --texto: #040404;
      --suave: #5a6b76; --borde: #e3e7ea; --acento: #602249; --violet: #321327;
      --hueso: #e7ebee; --brillo: rgba(255,255,255,.85);
      --sombra: 0 1px 2px rgba(5,26,42,.06), 0 8px 24px rgba(5,26,42,.05);

      width: 1440px; height: 900px; display: flex; overflow: hidden;
      background: var(--fondo); color: var(--texto);
      font-family: Poppins, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    }
    .app.oscuro {
      --fondo: #041521; --superficie: #0a2436; --texto: #ffffff;
      --suave: #9db0be; --borde: #14344a;
      --hueso: #133048; --brillo: rgba(255,255,255,.07);
      --sombra: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
    .voz { font-family: Fraunces, Georgia, serif; font-optical-sizing: auto; }

    /* ---- hueso: la pieza base del esqueleto ---- */
    .h { background: var(--hueso); border-radius: 7px; position: relative; overflow: hidden; }
    .h::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, var(--brillo), transparent);
      animation: barrido 1.5s ease-in-out infinite; }
    @keyframes barrido { to { transform: translateX(100%); } }
    .h.circ { border-radius: 50%; }
    @media (prefers-reduced-motion: reduce) { .h::after { animation: none; } }

    /* ---- lateral: no se esqueletiza, ya esta en pantalla ---- */
    .lateral { width: 268px; flex-shrink: 0; background: var(--navy); color: #fff;
      display: flex; flex-direction: column; padding: 26px 18px 20px;
      border-right: 1px solid rgba(250,232,144,.10); }
    .marca { display: flex; align-items: center; gap: 12px; padding: 0 8px 26px; }
    .marca svg { width: 34px; height: 34px; color: var(--gold); }
    .marca-txt b { display: block; font-size: 17px; font-weight: 700; letter-spacing: -.015em; }
    .marca-txt span { display: block; font-size: 10.5px; color: var(--gold); letter-spacing: .1em; text-transform: uppercase; margin-top: 5px; }
    .grupo { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.42);
      padding: 0 10px; margin: 14px 0 8px; font-weight: 600; }
    .nav { display: flex; flex-direction: column; gap: 3px; }
    .item { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px;
      font-size: 14px; font-weight: 500; color: rgba(255,255,255,.74); }
    .item svg { width: 19px; height: 19px; }
    .item.activo { background: var(--gold); color: var(--navy); font-weight: 600; }

    /* ---- principal ---- */
    .principal { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .barra { height: 68px; flex-shrink: 0; display: flex; align-items: center; padding: 0 34px;
      background: var(--superficie); border-bottom: 1px solid var(--borde); }
    .lienzo { flex: 1; overflow: hidden; padding: 28px 34px; }

    .migas { display: flex; align-items: center; gap: 9px; margin-bottom: 15px; }
    .cabecera { padding-bottom: 22px; border-bottom: 1px solid var(--borde); margin-bottom: 26px;
      display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }

    .tarjeta { background: var(--superficie); border: 1px solid var(--borde); border-radius: 15px;
      padding: 20px; box-shadow: var(--sombra); }

    /* aviso accesible: el lector de pantalla anuncia la carga */
    .aviso-carga { display: flex; align-items: center; gap: 10px; font-size: 12.5px;
      color: var(--suave); margin-bottom: 16px; }
    .pie { margin-top: auto; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.1); }
    .yo { display: flex; align-items: center; gap: 11px; padding: 9px 8px; }
    .av-mini { width: 38px; height: 38px; border-radius: 50%; background: var(--gold); color: var(--navy);
      display: grid; place-items: center; font-weight: 700; font-size: 14px; }
    .yo b { display: block; font-size: 13px; font-weight: 600; }
    .yo span { display: block; font-size: 11px; color: var(--gold); }
    .giro { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--borde);
      border-top-color: var(--blackberry); animation: girar .8s linear infinite; }
    .app.oscuro .giro { border-top-color: var(--gold); }
    @keyframes girar { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .giro { animation: none; } }

    /* Misma rejilla que el inicio real: cuenta a la izquierda, estado a la derecha */
    .dos { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 20px; }
    .cuadro-campos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 24px;
      margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--borde); }
    .perfil { display: grid; grid-template-columns: 348px minmax(0, 1fr); gap: 20px; }
    .col { display: flex; flex-direction: column; gap: 20px; }

    /* Misma rejilla que la tabla real, para que las cabeceras del esqueleto
       caigan sobre sus columnas. */
    .th-hueso { height: 44px; display: grid; grid-template-columns: 2.2fr 1.1fr 1.5fr 1fr 44px;
      align-items: center; gap: 14px; padding: 0 20px; border-bottom: 1px solid var(--borde); }
    .tr-hueso { height: 66px; display: grid; grid-template-columns: 2.2fr 1.1fr 1.5fr 1fr 44px;
      align-items: center; gap: 14px; padding: 0 20px; border-bottom: 1px solid var(--borde); }
    .tr-hueso:last-child { border-bottom: none; }
    .persona-hueso { display: flex; align-items: center; gap: 12px; }
  </style>
</helmet>

<div class="app {{tema}}">

  <!-- La barra lateral NO se esqueletiza: ya esta renderizada desde el layout -->
  <aside class="lateral">
    <div class="marca">

        <path d="M8.6 24.5V16a1.6 1.6 0 0 1 1.6-1.6h11.6A1.6 1.6 0 0 1 23.4 16v8.5" stroke-width="1.8"/>

      </svg>
      <div class="marca-txt">
        <b>Conejo App</b>
        <span class="voz">El Conejo del Sombrero</span>
      </div>
    </div>
    <div class="grupo">General</div>
    <nav class="nav">
      <div class="item activo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        Inicio
      </div>
      <div class="item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Mi perfil
      </div>
      <div class="item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Usuarios
      </div>
    </nav>
    <div class="pie">
      <div class="yo">
        <div class="av-mini">AR</div>
        <div>
          <b>Ana Rodriguez</b>
          <span>Admin</span>
        </div>
      </div>
    </div>
  </aside>

  <div class="principal">
    <header class="barra">
      <div class="h" style="width: 420px; height: 38px; border-radius: 10px;"></div>
      <div class="h" style="width: 38px; height: 38px; margin-left: auto; border-radius: 10px;"></div>
    </header>

    <div class="lienzo">
      <!-- migas y titulo: mismo hueco que la pagina real -->
      <div class="migas">
        <div class="h" style="width: 78px; height: 13px;"></div>
        <div class="h" style="width: 9px; height: 9px;"></div>
        <div class="h" style="width: 62px; height: 13px;"></div>
      </div>

      <div class="cabecera">
        <div style="flex: 1;">
          <div class="h" style="width: 168px; height: 15px; margin-bottom: 12px;"></div>
          <div class="h" style="width: 402px; height: 40px; border-radius: 9px;"></div>
          <div class="h" style="width: 470px; height: 14px; margin-top: 14px;"></div>
        </div>
        <div class="h" style="width: 168px; height: 44px; border-radius: 11px;"></div>
      </div>

      <div class="aviso-carga" role="status" aria-live="polite">
        <i class="giro" aria-hidden="true"></i>
        Cargando {{nombrePagina}}
      </div>

      <!-- ============ esqueleto de INICIO ============ -->
      <sc-if value="{{esInicio}}" hint-placeholder-val="{{ true }}">
        <div class="dos">
          <!-- tarjeta de cuenta -->
          <div class="tarjeta" style="padding: 24px;">
            <div style="display: flex; gap: 22px; align-items: flex-start;">
              <div class="h circ" style="width: 84px; height: 84px; flex-shrink: 0;"></div>
              <div style="flex: 1;">
                <div class="h" style="width: 216px; height: 26px;"></div>
                <div class="h" style="width: 186px; height: 13px; margin-top: 10px;"></div>
                <div style="display: flex; gap: 8px; margin-top: 14px;">
                  <div class="h" style="width: 64px; height: 22px; border-radius: 999px;"></div>
                  <div class="h" style="width: 88px; height: 22px; border-radius: 999px;"></div>
                </div>
              </div>
            </div>

            <div class="cuadro-campos">
              <div>
                <div class="h" style="width: 82px; height: 11px;"></div>
                <div class="h" style="width: 132px; height: 15px; margin-top: 9px;"></div>
              </div>
              <div>
                <div class="h" style="width: 48px; height: 11px;"></div>
                <div class="h" style="width: 148px; height: 15px; margin-top: 9px;"></div>
              </div>
              <div>
                <div class="h" style="width: 62px; height: 11px;"></div>
                <div class="h" style="width: 126px; height: 15px; margin-top: 9px;"></div>
              </div>
              <div>
                <div class="h" style="width: 152px; height: 11px;"></div>
                <div class="h" style="width: 104px; height: 15px; margin-top: 9px;"></div>
              </div>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--borde);">
              <div class="h" style="width: 152px; height: 44px; border-radius: 12px;"></div>
              <div class="h" style="width: 196px; height: 44px; border-radius: 12px;"></div>
            </div>
          </div>

          <!-- estado de la cuenta -->
          <div class="col">
            <div class="tarjeta">
              <div class="h" style="width: 104px; height: 12px; margin-bottom: 14px;"></div>
              <div class="h" style="width: 132px; height: 24px;"></div>
              <div class="h" style="width: 172px; height: 11px; margin-top: 11px;"></div>
            </div>
            <div class="tarjeta">
              <div class="h" style="width: 88px; height: 12px; margin-bottom: 14px;"></div>
              <div class="h" style="width: 120px; height: 24px;"></div>
              <div class="h" style="width: 190px; height: 11px; margin-top: 11px;"></div>
            </div>
            <div class="tarjeta">
              <div class="h" style="width: 112px; height: 12px; margin-bottom: 14px;"></div>
              <div class="h" style="width: 72px; height: 24px;"></div>
              <div class="h" style="width: 100%; height: 7px; border-radius: 999px; margin-top: 15px;"></div>
              <div class="h" style="width: 168px; height: 11px; margin-top: 11px;"></div>
            </div>
          </div>
        </div>
      </sc-if>

      <!-- ============ esqueleto de MI PERFIL ============ -->
      <sc-if value="{{esPerfil}}" hint-placeholder-val="{{ false }}">
        <div class="perfil">
          <div class="col">
            <div class="tarjeta" style="display:flex; flex-direction:column; align-items:center;">
              <div class="h circ" style="width: 108px; height: 108px;"></div>
              <div class="h" style="width: 152px; height: 18px; margin-top: 16px;"></div>
              <div class="h" style="width: 196px; height: 13px; margin-top: 9px;"></div>
              <div style="display:flex; gap:8px; margin-top:14px;">
                <div class="h" style="width: 62px; height: 22px; border-radius: 999px;"></div>
                <div class="h" style="width: 82px; height: 22px; border-radius: 999px;"></div>
              </div>
              <div class="h" style="width: 100%; height: 12px; margin-top: 20px;"></div>
              <div class="h" style="width: 76%; height: 12px; margin-top: 8px;"></div>
            </div>
            <div class="tarjeta">
              <div class="h" style="width: 68px; height: 15px; margin-bottom: 18px;"></div>
              <div style="display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:9px;">
                <div class="h" style="height: 62px; border-radius: 11px;"></div>
                <div class="h" style="height: 62px; border-radius: 11px;"></div>
                <div class="h" style="height: 62px; border-radius: 11px;"></div>
              </div>
            </div>
          </div>
          <div class="col">
            <div class="tarjeta">
              <div class="h" style="width: 172px; height: 15px; margin-bottom: 20px;"></div>
              <div style="display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:15px;">
                <div><div class="h" style="width:58px; height:11px; margin-bottom:8px;"></div><div class="h" style="height:44px; border-radius:10px;"></div></div>
                <div><div class="h" style="width:64px; height:11px; margin-bottom:8px;"></div><div class="h" style="height:44px; border-radius:10px;"></div></div>
                <div><div class="h" style="width:60px; height:11px; margin-bottom:8px;"></div><div class="h" style="height:44px; border-radius:10px;"></div></div>
                <div><div class="h" style="width:48px; height:11px; margin-bottom:8px;"></div><div class="h" style="height:44px; border-radius:10px;"></div></div>
                <div style="grid-column:1/-1;"><div class="h" style="width:52px; height:11px; margin-bottom:8px;"></div><div class="h" style="height:44px; border-radius:10px;"></div></div>
              </div>
            </div>
            <div class="tarjeta">
              <div class="h" style="width: 196px; height: 15px; margin-bottom: 20px;"></div>
              <div style="display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:15px;">
                <div style="grid-column:1/-1;"><div class="h" style="width:126px; height:11px; margin-bottom:8px;"></div><div class="h" style="height:44px; border-radius:10px;"></div></div>
                <div><div class="h" style="width:118px; height:11px; margin-bottom:8px;"></div><div class="h" style="height:44px; border-radius:10px;"></div></div>
                <div><div class="h" style="width:106px; height:11px; margin-bottom:8px;"></div><div class="h" style="height:44px; border-radius:10px;"></div></div>
              </div>
            </div>
          </div>
        </div>
      </sc-if>

      <!-- ============ esqueleto de USUARIOS ============ -->
      <sc-if value="{{esUsuarios}}" hint-placeholder-val="{{ false }}">

          <div style="display:flex; gap:9px; margin-bottom:16px;">
            <div class="h" style="width: 78px; height: 34px; border-radius: 999px;"></div>
            <div class="h" style="width: 116px; height: 34px; border-radius: 999px;"></div>
            <div class="h" style="width: 88px; height: 34px; border-radius: 999px;"></div>
            <div class="h" style="width: 118px; height: 34px; border-radius: 999px;"></div>
          </div>
          <div class="tarjeta" style="padding: 0; overflow: hidden;">
            <div class="th-hueso">
              <div class="h" style="width: 72px; height: 11px;"></div>
              <div class="h" style="width: 38px; height: 11px;"></div>
              <div class="h" style="width: 88px; height: 11px;"></div>
              <div class="h" style="width: 58px; height: 11px;"></div>
              <div></div>
            </div>
            <div class="tr-hueso">
              <div class="persona-hueso">
                <div class="h circ" style="width: 38px; height: 38px;"></div>
                <div>
                  <div class="h" style="width: 132px; height: 13px;"></div>
                  <div class="h" style="width: 188px; height: 11px; margin-top: 7px;"></div>
                </div>
              </div>
              <div class="h" style="width: 62px; height: 22px; border-radius: 999px;"></div>
              <div class="h" style="width: 92px; height: 13px;"></div>
              <div class="h" style="width: 66px; height: 13px;"></div>
              <div class="h" style="width: 18px; height: 18px;"></div>
            </div>
            <div class="tr-hueso">
              <div class="persona-hueso">
                <div class="h circ" style="width: 38px; height: 38px;"></div>
                <div>
                  <div class="h" style="width: 108px; height: 13px;"></div>
                  <div class="h" style="width: 204px; height: 11px; margin-top: 7px;"></div>
                </div>
              </div>
              <div class="h" style="width: 88px; height: 22px; border-radius: 999px;"></div>
              <div class="h" style="width: 92px; height: 13px;"></div>
              <div class="h" style="width: 66px; height: 13px;"></div>
              <div class="h" style="width: 18px; height: 18px;"></div>
            </div>
            <div class="tr-hueso">
              <div class="persona-hueso">
                <div class="h circ" style="width: 38px; height: 38px;"></div>
                <div>
                  <div class="h" style="width: 122px; height: 13px;"></div>
                  <div class="h" style="width: 176px; height: 11px; margin-top: 7px;"></div>
                </div>
              </div>
              <div class="h" style="width: 68px; height: 22px; border-radius: 999px;"></div>
              <div class="h" style="width: 158px; height: 13px;"></div>
              <div class="h" style="width: 92px; height: 13px;"></div>
              <div class="h" style="width: 18px; height: 18px;"></div>
            </div>
          </div>
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{
  "tema": {"editor":"enum","options":["claro","oscuro"],"default":"claro","section":"Vista"},
  "pagina": {"editor":"enum","options":["inicio","perfil","usuarios"],"default":"inicio","section":"Vista"}
}'>
class Component extends DCLogic {
  renderVals() {
    const pagina = this.props.pagina ?? 'inicio';
    const nombres = { inicio: 'el inicio', perfil: 'tu perfil', usuarios: 'los usuarios' };

    return {
      tema: this.props.tema ?? 'claro',
      esInicio: pagina === 'inicio',
      esPerfil: pagina === 'perfil',
      esUsuarios: pagina === 'usuarios',
      nombrePagina: nombres[pagina] ?? 'la pagina'
    };
  }
}
</script>
</body>
</html>
